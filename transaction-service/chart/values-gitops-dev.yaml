replicaCount: 2

image:
  repository: ghcr.io/andrewkmwangi/transaction-service
  tag: 7a859c40ea5983ee0b5db2daf0bca1033aa35a69
  pullPolicy: IfNotPresent

env:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/baraza_transactions"

  SPRING_DATASOURCE_USERNAME:
    secretKeyRef:
      name: postgres-secret
      key: POSTGRES_USER

  SPRING_DATASOURCE_PASSWORD:
    secretKeyRef:
      name: postgres-secret
      key: POSTGRES_PASSWORD

  ACCOUNT_SERVICE_URL: "http://account-service:8081"

startupProbe:
  tcpSocket:
    port: 8080
  periodSeconds: 10
  failureThreshold: 15
